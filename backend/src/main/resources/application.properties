# 1. Server Port Configuration
server.port=8080

# 2. Database Connection Configuration (Switched to H2 in-memory for instant startup)
spring.datasource.url=jdbc:h2:mem:syntaxsage_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver

# 3. Hibernate / JPA Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# 4. Groq Cloud API Keys Configuration
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.key=YOUR_GROQ_API_KEY_HERE